[project]
name = "lc-filter-notebooks"
version = "0.1.0"
description = "Jupyter notebooks for simulating LC filter designs using Scikit-RF"
authors = [
    {name = "Peter Matthews"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scikit-rf>=1.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ['py39']
